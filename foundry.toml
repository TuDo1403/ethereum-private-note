# Pinned so the BlobStore bytecode, and therefore its CREATE2 address, is reproducible.
# publish/src/lib.rs holds the expected hashes; `publish/README.md` says how to re-check them.
[profile.default]
src = "src"
out = "out"
test = "publish/test"
solc_version = "0.8.28"
evm_version = "paris"        # no PUSH0, so the same bytecode deploys on any EVM chain
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"       # no metadata hash: source comments cannot change the bytecode
cbor_metadata = false
auto_detect_solc = false
