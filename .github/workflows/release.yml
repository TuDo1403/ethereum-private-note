name: Release

# Push a tag like v1.2.3 to build the binaries on every supported architecture and publish them,
# with checksums and build provenance, as a GitHub release. "Run workflow" does the same builds
# without publishing, as a dry run. Only plain vX.Y.Z tags run: a pre-release tag such as v1.2.3-rc1
# would be published as a normal release, so it is not matched.
#
# Tag only a commit whose `ci` check is green: nothing here checks that.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux is built on the oldest runner image so the binaries need an older glibc/OpenSSL.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `vault --version` reports the workspace version, so a tag that disagrees would ship binaries
      # that name the wrong release.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$TAG" = "v$version" || { echo "tag $TAG != Cargo.toml version $version" >&2; exit 1; }
      - run: cargo build --release --locked --bins
      # The binaries must start on this platform (a missing library fails here, not on a user's machine).
      # `recover` has no --version.
      - name: Smoke test
        run: |
          target/release/vault --version
          target/release/publish --version
      # Branch names may contain '/', which a tarball name cannot: only a tag names the package.
      - name: Package
        env:
          NAME: epn-${{ github.ref_type == 'tag' && github.ref_name || 'dryrun' }}-${{ matrix.name }}
        run: |
          mkdir "$NAME"
          cp target/release/{recover,vault,publish} README.md SPEC.md "$NAME"/
          tar -czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The installer carries its own release tag, so the copy fetched from a release page installs
      # that release.
      - env:
          TAG: ${{ github.ref_name }}
        run: sed "s|@VERSION@|$TAG|" install.sh > dist/install.sh
      - run: cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
