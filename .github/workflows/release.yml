name: Release

# Push a tag like v1.2.3 to build the binaries on every supported architecture and publish them,
# with checksums and build provenance, as a GitHub release. "Run workflow" does the same builds
# without publishing, as a dry run.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux is built on the oldest runner image so the binaries need an older glibc/OpenSSL.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release --locked --bins
      - name: Package
        env:
          NAME: epn-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          mkdir "$NAME"
          cp target/release/{recover,vault,publish} README.md SPEC.md "$NAME"/
          tar -czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
