# Conventional Commits: `type(scope): subject`, e.g. `fix(vault): name the 1Password account`.
extends:
  - "@commitlint/config-conventional"
rules:
  # Wrapping is a style choice and trips on URLs and pasted output, so do not enforce it.
  body-max-line-length: [0]
  footer-max-line-length: [0]
  # Scope is optional, but when given it must be one of these.
  scope-enum:
    - 2
    - always
    - [core, recover, vault, publish, spec, vendor, ci, commitlint, release, deps]
