[package]
name = "epn-core"
version.workspace = true
edition = "2024"
rust-version = "1.100"  # the toolchain this was tested with, not a proven minimum

publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
base64ct = { version = "=1.8.3", features = ["alloc"] }  # encodes fido2 tool I/O
getrandom = "=0.4.3"                                    # OS randomness
hex = "=0.4.3"                                           # hex text of records and secrets
hkdf = "=0.13.0"
libc = "=0.2.191"                                        # process hardening and the network check (host.rs)
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"

[dev-dependencies]
serde_json = "=1.0.154"
