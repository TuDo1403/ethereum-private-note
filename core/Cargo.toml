[package]
name = "epn-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.94"  # the toolchain this was tested with, not a proven minimum

publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
base64ct = { version = "=1.6.0", features = ["alloc"] }  # encodes fido2 tool I/O
getrandom = "=0.2.17"                                    # OS randomness
hex = "=0.4.3"                                           # hex text of records and secrets
hkdf = "=0.12.4"
sha2 = "=0.10.8"
unicode-normalization = "=0.1.24"

[dev-dependencies]
serde_json = "=1.0.133"
