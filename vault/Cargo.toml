[package]
name = "epn-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"  # the toolchain this was tested with, not a proven minimum

publish = false

[lints]
workspace = true

# The guided backup and restore wizard. Losing it never blocks a restore, because `recover` and the
# format in SPEC.md stand alone.
[dependencies]
epn-core = { path = "../core" }
rpassword = "=7.5.5"  # hidden prompts on the tty
zeroize = "=1.9.1"    # wipe seed, passphrase and key material after use
# Terminal UX only (never on the restore path: `recover` stays tiny). Secrets are still read with rpassword.
clap = { version = "=4.6.7", features = ["derive"] }  # arguments, --help
console = "=0.16.6"                                   # colors (honours NO_COLOR) and the terminal
dialoguer = { version = "=0.12.0", default-features = false }  # arrow-key menus and confirmations
indicatif = "=0.18.6"                                 # spinner while Argon2 runs

[[bin]]
name = "vault"
path = "src/main.rs"
